[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc2md"
version = "0.3.12"
description = "Universal Document to Markdown converter with Audio Engine (8+ hrs), Drag-and-Drop GUI, Multi-Format Export & Progress Tracking."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "doc2md contributors" }]
keywords = ["markdown", "converter", "pdf", "docx", "xlsx", "pptx", "ocr", "llm", "tokens"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "charset-normalizer>=3.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyperclip>=1.8",
    "tiktoken>=0.5",
]

[project.optional-dependencies]
docs = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6.23",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]
ocr = ["Pillow>=10.0", "pytesseract>=0.3.10"]
ocr-rapid = ["rapidocr-onnxruntime>=1.3"]
audio = [
    "faster-whisper>=1.0",
    "ffmpeg-python>=0.2",
    "torch>=2.0; platform_system != 'Darwin'",
]
gui = [
    "customtkinter>=5.0",
    "tkinterdnd2>=0.3.0; platform_system == 'Windows'",
    "python-docx>=1.1",
]
exe = ["pyinstaller>=6.10"]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "pytest-cov>=5.0", "customtkinter>=5.0", "python-docx>=1.1"]

[project.scripts]
doc2md = "doc2md.cli.main:app"

[project.urls]
Homepage = "https://example.invalid/doc2md"

[tool.setuptools.packages.find]
include = ["doc2md*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
omit = [
    "doc2md/gui/*",
    "doc2md/engine/audio_engine.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
