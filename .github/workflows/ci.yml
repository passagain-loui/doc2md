name: CI Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    env:
      # The GUI tests build real widgets; the offscreen plugin lets them run on
      # a runner with no display.
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt

      - name: Install Tesseract with Thai language data
        run: choco install tesseract --params "/InstallDir:C:\Tesseract" -y

      - name: Add Tesseract to PATH
        run: echo "C:\Tesseract" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run the verification gate
        run: powershell -ExecutionPolicy Bypass -File ./tools/verify.ps1

      - name: Coverage report
        run: pytest tests/ --cov=doc2md --cov-report=xml -q

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
        if: always()
